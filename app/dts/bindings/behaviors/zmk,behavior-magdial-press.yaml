description: |
  Magdial press dispatch: single / double / triple tap and long press each
  tap their RPC-configured behavior binding. Bind at the dial's push-button
  keymap position.

compatible: "zmk,behavior-magdial-press"

include: zero_param.yaml

properties:
  tapping-term-ms:
    type: int
    default: 250
  hold-ms:
    type: int
    default: 500
  tap-ms:
    type: int
    default: 30
